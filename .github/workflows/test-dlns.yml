name: Check DLNS Database

on:
  pull_request:
    paths:
      - 'DLNS.html'
      - 'dlns/**'
      - 'supabase/**'
      - 'scripts/*dlns*'
      - '.github/workflows/test-dlns.yml'
  push:
    branches: [main]
    paths:
      - 'DLNS.html'
      - 'dlns/**'
      - 'supabase/**'
      - 'scripts/*dlns*'
      - '.github/workflows/test-dlns.yml'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .cache/dlns-tools --ignore-scripts @electric-sql/pglite@0.5.10
      - run: node scripts/test-dlns-database.mjs
