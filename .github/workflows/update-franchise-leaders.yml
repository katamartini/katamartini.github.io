name: Update NFL franchise leaders

on:
  workflow_dispatch:
  schedule:
    # Tuesday after Monday Night Football, with a Wednesday retry.
    - cron: "47 16 * * 2"
    - cron: "53 16 * * 3"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-franchise-leaders
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check franchise leader calculations
        run: node --test nfl/franchise-leaders-data.test.mjs
      - name: Refresh receiving, passing, rushing, sacks, and current rosters
        run: node scripts/update-franchise-leaders.mjs
      - name: Commit data and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/franchise-leaders.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/franchise-leaders.json
            git commit -m "Update NFL franchise leaders"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
