name: Update NFL quarterbacks

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-qbs
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .cache/qbs
          key: qbs-v1-${{ github.run_id }}
          restore-keys: qbs-v1-
      - name: Test QB calculations
        run: node --test nfl/qbs-data.test.mjs nfl/qbs-history.test.mjs
      - name: Refresh QB starting streaks, franchise records and rosters
        run: node scripts/update-qbs.mjs
      - name: Validate refreshed QB records
        run: node --test nfl/qbs-data.test.mjs nfl/qbs-history.test.mjs
      - name: Commit data and request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/qbs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/qbs.json
            git commit -m "Update NFL quarterbacks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
