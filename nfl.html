<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Football pages and trackers on kmartini.com.">
  <meta name="theme-color" content="#f4f5f1">
  <link rel="canonical" href="https://kmartini.com/nfl">
  <title>NFL — kmartini.com</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #20221f;
      background: #f4f5f1;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .home {
      color: #61665e;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .home:hover,
    .home:focus-visible { text-decoration: underline; }

    h1 {
      margin: 44px 0 8px;
      font-size: clamp(2.6rem, 8vw, 4.5rem);
      line-height: 1;
    }

    .intro {
      margin: 0 0 42px;
      color: #61665e;
      font-size: 1.05rem;
    }

    .pages { border-top: 1px solid #cdd0c9; }

    .page-link {
      display: grid;
      padding: 22px 4px;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid #cdd0c9;
      color: inherit;
      text-decoration: none;
    }

    .page-link:hover h2,
    .page-link:focus-visible h2 { text-decoration: underline; }

    .page-link:focus-visible {
      outline: 2px solid #20221f;
      outline-offset: 4px;
    }

    h2 {
      margin: 0 0 4px;
      font-size: 1.25rem;
    }

    .page-link p {
      margin: 0;
      color: #61665e;
      font-size: 0.92rem;
    }

    .arrow {
      color: #61665e;
      font-size: 1.3rem;
    }

    @media (max-width: 480px) {
      main { padding-top: 36px; }
      h1 { margin-top: 36px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="home" href="/">kmartini.com</a>

    <h1>NFL</h1>
    <p class="intro">Football pages and trackers.</p>

    <nav class="pages" aria-label="NFL pages">
      <a class="page-link" href="/hotseat">
        <div>
          <h2>Hot Seats</h2>
          <p>NFL coaching hot-seat rankings.</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="page-link" href="/jj23k">
        <div>
          <h2>JJ23K Tracker</h2>
          <p>Follow Justin Jefferson’s race to 23,000 receiving yards.</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
